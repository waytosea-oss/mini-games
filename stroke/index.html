<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e2a2a">
<title>一笔绘山海 · 青鸟寻踪</title>
<link rel="preload" href="assets/logo.webp" as="image">
<link rel="stylesheet" href="../common/kit.css?v=20261025">
<style>
:root{--k-bg:#0e2a2a;--k-panel1:#1f5a52;--k-panel2:#0f2f2c;--k-frame:#e8c46a;--k-edge:#082220;
 --k-tg1:#3fbfa6;--k-tg2:#11645a;--k-tgD:#073a34;--k-tgB:#f4dc96;
 --k-teal1:#9ff5e2;--k-teal2:#2fb59c;--k-teal3:#147a6a;--k-tealD:#08443b;
 --k-red1:#ff9c86;--k-red2:#d8452e;--k-red3:#a82a1a;--k-redD:#5e140a;
 --k-hub1:#2a6f66;--k-hub2:#18514a;--k-hub3:#0f3a35;--k-hubD:#061f1c;--k-hubT:#ffeab0;
 --k-dim1:rgba(10,40,38,.55);--k-dim2:rgba(3,14,13,.86)}
#load{background:#0e2a2a;z-index:30}
#load img{width:min(86vw,360px)}
#load .bar{width:62%;max-width:300px;height:12px;border-radius:9px;background:#0a201f;box-shadow:inset 0 2px 4px #0008;overflow:hidden;margin-top:18px;border:1.5px solid #c9a24a}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d6b60,#5fe0c4,#f4dc96);transition:width .2s}
#load p{margin-top:12px;color:#d8f5ee;font-size:14px;letter-spacing:2px}
#menu{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 7vh)}
.logo{display:block;margin-top:30px;width:min(92vw,440px);height:auto;transform-origin:50% 60%;animation:breathe 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,30,28,.45));pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-.5deg)}50%{transform:scale(1.022) rotate(.5deg)}}
.sub{margin-top:2px;font-size:14px;font-weight:800;color:#fff8e6;letter-spacing:4px;text-shadow:0 2px 4px #0009;background:linear-gradient(90deg,rgba(10,50,46,0),rgba(10,50,46,.78) 20%,rgba(10,50,46,.78) 80%,rgba(10,50,46,0));padding:6px 34px}
.hero{width:min(58vw,250px);aspect-ratio:360/376;margin-top:auto;visibility:hidden;pointer-events:none}
.menuBtns{display:flex;flex-direction:column;align-items:center;margin:0 0 calc(env(safe-area-inset-bottom) + 24px + 2vh)}
.stat{margin-top:12px;font-size:13px;color:#eafff9;text-shadow:0 1px 3px #000}
#levels{background:radial-gradient(ellipse at 50% 30%,rgba(16,60,56,.72),rgba(3,16,15,.94))}
#levels h2{color:#f4dc96;text-shadow:0 3px 0 #0a3a34,0 6px 12px #000}
#levels .tot{font-size:14px;color:#d8f5ee;margin-bottom:8px}
.lvgroup{display:flex;align-items:center;gap:8px;margin:14px 6px 4px;font-size:16px;font-weight:900;color:#f4dc96;letter-spacing:2px}
.lvgroup small{font-size:12px;font-weight:600;color:#bfe8de;letter-spacing:0}
.lvgroup::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#f4dc9680,transparent)}
.lv.c1{--k-teal1:#ffe0ef;--k-teal2:#e78fb6;--k-teal3:#a8517c;--k-tealD:#5a2142}
.lv.c2{--k-teal1:#bfe6ff;--k-teal2:#4a9fe0;--k-teal3:#22609e;--k-tealD:#0f3358}
.lv.c3{--k-teal1:#fff2c4;--k-teal2:#e0b04a;--k-teal3:#a87414;--k-tealD:#5a3a06}
.lv.c4{--k-teal1:#d6ccff;--k-teal2:#7a68d8;--k-teal3:#47389a;--k-tealD:#221a52}
.panel .info b{color:#f4dc96}
.help{margin-top:14px;font-size:13.5px;color:#dff7f1;line-height:1.75;text-align:left;background:rgba(0,0,0,.22);padding:10px 14px;border-radius:14px}
.help b{color:#f4dc96}
#introC{display:block;margin:2px auto 6px;width:240px;height:150px}
/* 游戏内 HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
#hud .top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:flex-start;justify-content:space-between;padding:0 12px}
#hud .tg{pointer-events:auto}
#hud .ttl{text-align:center;flex:1;margin:0 8px}
#hud .ttl b{display:inline-block;font-size:19px;font-weight:900;letter-spacing:2px;color:#fff;padding:5px 18px;border-radius:16px;background:linear-gradient(#1f6b60,#0e3d37);border:2px solid #f4dc96;box-shadow:0 4px 0 #062420,0 6px 10px #0006;text-shadow:0 2px 0 #062420}
#hud .ttl i{display:block;font-style:normal;margin-top:6px;font-size:13px;font-weight:800;color:#1a3a36;text-shadow:0 1px 0 #fff8}
#hud .ttl i span{display:inline-block;padding:2px 10px;border-radius:10px;background:rgba(255,250,235,.72);margin:0 2px}
#hud .bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;gap:26px}
.rb{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;font-family:inherit;color:#123a35;font-size:13px;font-weight:900;letter-spacing:1px;cursor:pointer;text-shadow:0 1px 0 #fff9}
.rb .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fffaf0,#efe2c0 60%,#cdb684);border:2.5px solid #2a5a52;box-shadow:0 5px 0 #1d453f,0 8px 12px #0005}
.rb .c svg{width:28px;height:28px}
.rb:active .c{transform:translateY(3px);box-shadow:0 2px 0 #1d453f,0 4px 6px #0005}
.rb .n{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#d8452e;color:#fff;font-size:13px;line-height:18px;border:2px solid #fff6dc;text-shadow:none}
.rb.dis{opacity:.45}
@media (max-height:700px){.rb .c{width:50px;height:50px}#hud .ttl b{font-size:17px}.hero{width:min(46vw,190px)}.logo{margin-top:22px;width:min(84vw,360px)}#menu{padding-top:calc(env(safe-area-inset-top) + 4vh)}}
@media (max-height:640px){.hero{width:min(40vw,160px)}.btn{padding:12px 24px;font-size:20px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="load" class="scr on">
  <img src="assets/logo.webp" alt="一笔绘山海">
  <div class="bar"><i id="loadBar"></i></div>
  <p id="loadTxt">研墨铺纸中…</p>
</div>

<div id="menu" class="scr">
  <button class="hubPill" id="mHub" aria-label="返回游戏屋"><b>‹</b>游戏屋</button>
  <div class="toggles"><button class="tg" id="tMusic" aria-label="音乐"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="#fff"/><circle cx="17.5" cy="16" r="2.8" fill="#fff"/></svg></button><button class="tg" id="tSfx" aria-label="音效"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <img class="logo" src="assets/logo.webp" alt="一笔绘山海">
  <div class="sub">青 鸟 衔 笔 · 一 笔 画 遍 山 海</div>
  <div class="hero" id="mHero"></div>
  <div class="menuBtns">
    <button class="btn" id="bPlay">开 始 绘 卷</button>
    <button class="btn teal small" id="bLevels" style="min-width:180px">山海图卷</button>
    <div class="stat" id="mStat"></div>
  </div>
</div>

<div id="levels" class="scr lvwrap">
  <div class="toggles left"><button class="tg" id="lvBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <h2>山海图卷</h2>
  <div class="tot" id="lvTot"></div>
  <div class="lvscroll" id="lvList"></div>
</div>

<div id="hud">
  <div class="top">
    <button class="tg" id="hPause" aria-label="暂停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
    <div class="ttl"><b id="hTitle">第 1 关</b><i><span id="hInk">墨迹 0/0</span><span id="hTime">0:00</span></i></div>
    <div style="width:44px"></div>
  </div>
  <div class="bot">
    <button class="rb" id="hUndo"><span class="c"><svg viewBox="0 0 24 24" fill="none"><path d="M9 7L4 12l5 5" stroke="#1d453f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a6 6 0 0 1 0 12h-2" stroke="#1d453f" stroke-width="2.6" stroke-linecap="round" transform="translate(0 -5)"/></svg></span>撤一步</button>
    <button class="rb" id="hRestart"><span class="c"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#1d453f" stroke-width="2.6" stroke-linecap="round"/><path d="M18 3v4.5h-4.5" stroke="#1d453f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>重画</button>
    <button class="rb" id="hHint"><span class="c"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" fill="#f4c44e" stroke="#1d453f" stroke-width="2"/><path d="M9.5 19h5M10.5 21.5h3" stroke="#1d453f" stroke-width="2" stroke-linecap="round"/></svg></span>指路<span class="n" id="hHintN">3</span></button>
  </div>
</div>

<div id="pause" class="scr dim">
  <div class="panel">
    <div class="ph gold">歇 一 歇</div>
    <div class="row" style="margin:4px 0 6px">
      <button class="tg" id="pMusic" aria-label="音乐"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="#fff"/><circle cx="17.5" cy="16" r="2.8" fill="#fff"/></svg></button>
      <button class="tg" id="pSfx" aria-label="音效"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <button class="btn teal" id="pResume">继续绘卷</button><br>
    <div class="row"><button class="btn small" id="pRestart">重新画</button><button class="btn small red" id="pQuit">山海图卷</button></div>
    <button class="btn small hub" id="pHub">返回游戏屋</button>
    <div class="help">① 按住一块山石，<b>一笔连到底</b>，每条山径都要画到<br>② 画过的路不能再走；<b>岔路为单数</b>的山石，往往是起点或终点<br>③ 云桥要走<b>两遍</b>，溪流只能<b>顺水</b>而行，白泽要<b>最后</b>唤醒</div>
  </div>
</div>

<div id="intro" class="scr dim">
  <div class="panel">
    <div class="ph" id="iTitle">新奇遇</div>
    <canvas id="introC" width="480" height="300"></canvas>
    <div class="info" id="iText"></div>
    <button class="btn teal" id="iOk">知道啦</button>
  </div>
</div>

<div id="win" class="scr dim">
  <div class="panel">
    <div class="ph gold" id="wTitle">山海入画！</div>
    <div class="stars" id="wStars"><span></span><span></span><span></span></div>
    <div class="info" id="wInfo"></div>
    <div class="row" style="margin-top:2px"><button class="btn small" id="wRetry">再画一次</button><button class="btn small red" id="wMenu">图卷</button></div>
    <button class="btn teal" id="wNext">下一关</button><br>
    <button class="btn small hub" id="wHub">返回游戏屋</button>
  </div>
</div>

<div id="fail" class="scr dim">
  <div class="panel">
    <div class="ph gray" id="fTitle">墨尽于此</div>
    <div class="info" id="fInfo"></div>
    <div class="row"><button class="btn small teal" id="fUndo">撤一步</button><button class="btn small" id="fHint">指路</button></div>
    <div class="row"><button class="btn small red" id="fRetry">重新画</button><button class="btn small hub" id="fHub">返回游戏屋</button></div>
  </div>
</div>

<div id="toast"></div>
<script src="../track.js?v=20261025"></script>
<script src="../common/kit.js?v=20261025"></script>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
