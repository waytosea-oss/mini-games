<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>十三声钟响</title>
<meta name="theme-color" content="#10142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="十三声钟响">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"ZCOOL QingKe HuangYou";src:url("fonts/ZCOOLQingKeHuangYou-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Silkscreen";src:url("fonts/Silkscreen-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --bg:#10142a; --panel:#181d3a; --line:#2f3868; --ink:#f1e8d4; --dim:#9aa3c7;
  --brass:#e6a94f; --teal:#5fe0d2; --red:#ff6b6b; --purple:#b388ff;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:8px 8px;
  font-family:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-inline:16px; box-sizing:border-box;
}
.wrap{max-width:780px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:30px;letter-spacing:.08em;color:var(--brass);line-height:1;text-shadow:3px 3px 0 #3a2410}
.brand small{display:block;font-size:13px;color:var(--dim);letter-spacing:.2em;margin-top:6px;text-shadow:none}
.hubPill{font-family:inherit;font-size:14px;color:var(--ink);background:rgba(12,14,32,.92);border:3px solid #efe6d2;outline:3px solid #06070f;padding:3px 12px 3px 8px;cursor:pointer;letter-spacing:.08em}
.hubPill:hover,.hubPill:focus-visible{color:var(--brass);border-color:var(--brass)}
.lvl{font-size:16px;color:var(--teal);text-align:right}
.goal{font-size:15px;color:var(--ink);text-align:right;opacity:.9}
.goal b{color:var(--brass);font-weight:normal}
.inv{display:flex;gap:6px;flex-wrap:wrap;min-height:26px;align-items:center}
.inv .lab{font-size:13px;color:var(--dim);letter-spacing:.15em}
.chip{font-size:14px;padding:2px 8px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.chip.new{border-color:var(--brass);color:var(--brass)}

.screen{container-type:inline-size;position:relative;width:100%;aspect-ratio:4/3;background:#000;
  border:4px solid #efe6d2;outline:4px solid #070914;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

.box{background:rgba(12,14,32,.95);border:3px solid #efe6d2;outline:3px solid #06070f;box-sizing:border-box}
#dlg{position:absolute;left:2.5%;right:2.5%;bottom:2.5%;min-height:27%;display:flex;gap:3%;padding:2.2% 3%;cursor:pointer}
#dlg .port{width:14%;aspect-ratio:1;flex:none;background:#262c52;border:2px solid #efe6d2;image-rendering:pixelated;align-self:flex-start}
#dlg .body{flex:1;min-width:0}
#dlg .name{color:var(--brass);font-size:clamp(12px,2.9cqw,21px);margin-bottom:.2em}
#dlg .txt{font-size:clamp(13px,3.3cqw,24px);line-height:1.5;white-space:pre-wrap}
#dlg.narr .txt{color:#d8d2ff}
#dlg .more{position:absolute;right:2.5%;bottom:5%;color:var(--brass);font-size:clamp(10px,2.4cqw,16px);animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

#choice{position:absolute;right:2.5%;bottom:2.5%;padding:1.6% 2.5%;min-width:42%;max-width:70%}
#choice .ph{font-size:clamp(11px,2.5cqw,17px);color:var(--dim);margin-bottom:.3em;letter-spacing:.1em}
#choice ul{list-style:none;margin:0;padding:0}
#choice li{font-size:clamp(13px,3.1cqw,22px);padding:.18em .2em .18em 1.3em;position:relative;cursor:pointer}
#choice li.on{color:var(--brass)}
#choice li.on::before{content:"▶";position:absolute;left:0;font-size:.8em;top:.35em}

#card,#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2cqw;cursor:pointer}
#card{background:rgba(6,7,18,.9)}
#card .k{font-family:"Silkscreen",monospace;color:var(--teal);font-size:clamp(11px,2.4cqw,16px);letter-spacing:.3em}
#card h2{margin:0;font-weight:normal;font-size:clamp(26px,8cqw,60px);color:var(--brass);text-shadow:4px 4px 0 #3a2410;text-wrap:balance}
#card p{margin:0;font-size:clamp(13px,3.2cqw,22px);max-width:80%;line-height:1.6;color:var(--ink)}
#card .hint,#title .hint{font-size:clamp(11px,2.3cqw,15px);color:var(--dim);animation:bl 1.2s steps(2) infinite}

#title{cursor:default;background:linear-gradient(180deg,rgba(6,7,18,.1),rgba(6,7,18,.55));gap:1.4cqw}
#title h1{margin:0;font-weight:normal;font-size:clamp(34px,11cqw,84px);color:var(--brass);letter-spacing:.06em;text-shadow:5px 5px 0 #3a2410,0 0 30px rgba(230,169,79,.3)}
#title .sub{font-size:clamp(12px,2.8cqw,19px);color:var(--ink);letter-spacing:.2em}
#title .menu{display:flex;flex-direction:column;gap:1.2cqw;margin-top:.6cqw;align-items:center;max-width:94%}
.btn{font-family:inherit;font-size:clamp(14px,3.3cqw,23px);color:var(--ink);background:rgba(12,14,32,.92);border:3px solid #efe6d2;outline:3px solid #06070f;padding:.3em 1.2em;cursor:pointer;min-width:12em}
.btn:hover,.btn:focus-visible{color:var(--brass);border-color:var(--brass);outline-color:#3a2410}
.btn.sm{font-size:clamp(11px,2.4cqw,16px);min-width:0;padding:.15em .6em}
.row{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.row .ct{font-size:clamp(11px,2.4cqw,16px);color:var(--teal);min-width:5.5em;text-align:right}

#bhud{position:absolute;left:2.5%;right:2.5%;top:2.5%;display:flex;justify-content:space-between;gap:4%;pointer-events:none}
#bhud .side{flex:1;max-width:44%}
#bhud .nm{font-size:clamp(12px,2.8cqw,20px);display:flex;justify-content:space-between}
#bhud .bar{height:clamp(6px,1.6cqw,12px);background:#2a1622;border:2px solid #efe6d2;margin-top:.25em}
#bhud .bar i{display:block;height:100%;background:var(--purple);transition:width .25s steps(6)}
#bhud .hp i{background:var(--red)}
#bhud .r{text-align:right}

#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(16px,4.6cqw,34px);color:var(--brass);text-shadow:3px 3px 0 #000;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#gain{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:clamp(12px,3cqw,20px);padding:.3em .9em;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#gain.show{opacity:1}
#mute{position:absolute;right:1.5%;top:1.5%;z-index:5}

.ctrl{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.keys{font-size:14px;color:var(--dim);line-height:1.7}
.keys kbd{font-family:"Silkscreen",monospace;font-size:11px;border:2px solid var(--line);padding:0 5px;color:var(--ink);background:var(--panel)}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button,.abtn{font-family:"Silkscreen",monospace;background:var(--panel);color:var(--ink);border:3px solid var(--line);font-size:16px;touch-action:none;cursor:pointer}
.pad button:active,.abtn:active{background:#2c3466;border-color:var(--brass)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.abtn{width:84px;height:84px;border-radius:50%;font-family:inherit;font-size:22px;color:var(--brass);border-color:var(--brass)}
.touch{display:none;width:100%;justify-content:space-between;align-items:center}
@media (pointer:coarse),(max-width:620px){.touch{display:flex}}
.note{font-size:13px;color:var(--dim);line-height:1.7}

.guide-btn{font-family:inherit;font-size:15px;color:var(--brass);background:var(--panel);border:2px solid var(--brass);padding:3px 12px;cursor:pointer;margin-bottom:6px}
.guide-btn:hover,.guide-btn:focus-visible{background:#2c2410}
#hintBtn{position:absolute;left:1.5%;top:1.5%;z-index:5}
#board{position:fixed;inset:0;z-index:50;background:rgba(9,11,26,.985);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 0px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);box-sizing:border-box}
.bwrap{max-width:1060px;margin:0 auto}
.bhead{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:16px 12px;background:linear-gradient(180deg,rgba(9,11,26,1) 80%,rgba(9,11,26,0));}
.bhead h2{margin:0;font-weight:normal;font-size:30px;color:var(--brass);letter-spacing:.08em;text-shadow:3px 3px 0 #3a2410;line-height:1}
.bhead p{margin:6px 0 0;font-size:14px;color:var(--dim)}
.chap{margin-top:22px}
.chap-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:14px}
.chap-h .k{font-family:"Silkscreen",monospace;font-size:12px;color:var(--teal);letter-spacing:.2em}
.chap-h h3{margin:0;font-weight:normal;font-size:24px;color:var(--ink)}
.chap-h span{font-size:14px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.lcard{position:relative;display:flex;flex-direction:column;background:var(--panel);border:3px solid #efe6d2;outline:3px solid #06070f}
.lcard.cur{border-color:var(--brass);box-shadow:0 0 0 3px rgba(230,169,79,.25),0 10px 30px rgba(0,0,0,.4)}
.lcard .shot{position:relative;border-bottom:3px solid #efe6d2;background:#000}
.lcard canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated}
.lcard .no{position:absolute;left:8px;top:8px;font-family:"Silkscreen",monospace;font-size:13px;background:rgba(8,9,20,.88);color:var(--brass);border:2px solid var(--brass);padding:1px 7px}
.lcard .curtag{position:absolute;right:8px;top:8px;font-size:13px;background:var(--brass);color:#1a1206;padding:1px 8px}
.lcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lcard h4{margin:0;font-weight:normal;font-size:21px;color:var(--brass)}
.lcard .plot{margin:0;font-size:15px;line-height:1.7;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags i{font-style:normal;font-size:12px;color:var(--teal);border:1px solid #2f6f6a;padding:0 6px}
.lcard details{border:2px solid var(--line);background:#12162e}
.lcard summary{cursor:pointer;padding:5px 10px;font-size:15px;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
.lcard summary::-webkit-details-marker{display:none}
.lcard summary::after{content:"＋";color:var(--brass)}
.lcard details[open] summary::after{content:"－"}
.lcard summary:focus-visible{outline:2px solid var(--brass)}
.lcard details.spoil summary{color:#ffb4a8}
.lcard details .in{padding:2px 12px 10px;font-size:14px;line-height:1.75;color:#d8d2ff}
.lcard details ol{margin:0;padding-left:1.4em}
.lcard .go{margin-top:auto;display:flex;justify-content:flex-end}
.lcard .go button{font-family:inherit;font-size:15px;background:transparent;color:var(--ink);border:2px solid #efe6d2;padding:3px 12px;cursor:pointer}
.lcard .go button:hover,.lcard .go button:focus-visible{color:var(--brass);border-color:var(--brass)}
.lcard .go .lock{font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#dlg .more,#card .hint,#title .hint{animation:none}}
</style>

<div class="wrap">
  <div class="top">

      <div class="side"><div class="nm"><span id="bename">—</span><span id="behp"></span></div><div class="bar"><i id="bebar" style="width:100%"></i></div></div>

        <button class="u" data-dir="up" type="button">▲</button>

  <div id="board" hidden role="dialog" aria-modal="true" aria-label="关卡图鉴"><div class="bwrap"><div class="bhead"><div><h2>关卡图鉴</h2><p>全部关卡的剧情一览，也可以从这里选关。卡住了就打开「小提示」，还是不行再看「完整攻略」。</p></div><button class="btn sm" id="boardClose" type="button">返回游戏（Esc）</button></div><div id="boardBody"></div></div></div>

</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const W=256,H=192;
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const rev=s=>[...s].reverse().join('');

/* ================= audio: sfx ================= */
let AC=null, muted=false;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d=.08,type='square',v=.04,when=0,out){ const a=audio(); if(!a||muted)return; const t=a.currentTime+when; const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(out||a.destination); o.start(t); o.stop(t+d+.05); }
function bell(f,when=0,v=1){ tone(f,1.8,'sine',.12*v,when); tone(f*2.01,1.1,'sine',.04*v,when); tone(f*3.02,.5,'triangle',.02*v,when); }
let NOISE=null;
function noiseBuf(){ const a=audio(); if(!a)return null; if(!NOISE){ const len=a.sampleRate*2; NOISE=a.createBuffer(1,len,a.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; } return NOISE; }
function noise(d=1.4,v=.25,freq=380,when=0,type='lowpass',out){ const a=audio(); if(!a||muted)return; const t=a.currentTime+when; const s=a.createBufferSource(); s.buffer=noiseBuf(); const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=a.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(f).connect(g).connect(out||a.destination); s.start(t); s.stop(t+d+.05); }
const sfx={
  blip:(p=1)=>tone(420*p+Math.random()*40,.035,'square',.018),
  get:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.035,i*.07))},
  hit:()=>{tone(180,.12,'sawtooth',.06);noise(.15,.15,900)},
  hurt:()=>{tone(140,.2,'square',.06);tone(90,.25,'square',.05,.05)},
  sel:()=>tone(660,.05,'square',.025),
  ok:()=>tone(880,.07,'square',.03),
  bump:()=>tone(90,.05,'square',.03),
  step:()=>tone(120+Math.random()*20,.02,'triangle',.02),
  magic:()=>{[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.03,i*.05))},
  glitch:()=>{for(let i=0;i<6;i++)tone(200+Math.random()*900,.05,'sawtooth',.025,i*.04)},
  thunder:()=>noise(2.2,.35,300),
  lever:()=>{tone(220,.06,'square',.04);tone(330,.08,'square',.03,.06)},
};

/* ================= audio: background music ================= */
/* 想换成 Gemini 生成的曲子：把 mp3 和本页一起发布，然后在这里填路径，例如 {town:'bgm/town.mp3'}。
   有填的曲目会播放音频文件，没填的继续用下面的芯片音乐。 */
const BGM_FILES={};
const NOTE_I={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){ const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); if(!m)return 0; const midi=12*(+m[3]+1)+NOTE_I[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,(midi-69)/12); }
function voice(str,wave,vol){ const tk=str.replace(/\|/g,' ').trim().split(/\s+/); const ev=tk.map((t,i)=>{ if(t==='.'||t==='-')return null; let d=1; while(tk[i+d]==='-')d++; return {f:nf(t),d}; }); return {ev,len:tk.length,wave,vol}; }
const TRACKS={
  title:{bpm:104,drums:'k...s...',v:[
    voice('E5 G5 C6 G5 A5 - G5 E5 | F5 A5 D6 A5 G5 - F5 D5 | E5 G5 C6 E6 D6 C6 A5 G5 | F5 E5 D5 G4 C5 - - .','triangle',.07),
    voice('C3 . G3 . A2 . E3 . | D3 . A3 . G2 . D3 . | C3 . G3 . F2 . C3 . | G2 . G2 . C3 . . .','square',.025)]},
  night:{bpm:80,drums:'h...h...',v:[
    voice('A4 - - C5 E5 - D5 - | C5 - B4 - G4 - - . | A4 - - C5 F5 - E5 - | D#5 - E5 - B4 - - .','triangle',.07),
    voice('A2 - - - - - - - | G2 - - - - - - - | F2 - - - - - - - | E2 - - - - - - -','sine',.09)]},

function mnote(f,t,d,wave,vol,out){ const a=AC; const o=a.createOscillator(),g=a.createGain(); o.type=wave; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.setValueAtTime(vol,t+Math.max(.02,d*.6)); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(out); o.start(t); o.stop(t+d+.05); }

  if(ch==='k'){ const o=a.createOscillator(),g=a.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.12); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.0001,t+.15); o.connect(g).connect(out); o.start(t); o.stop(t+.2); }

  else if(ch==='h'){ const s=a.createBufferSource(); s.buffer=noiseBuf(); const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; const g=a.createGain(); g.gain.setValueAtTime(.025,t); g.gain.exponentialRampToValueAtTime(.0001,t+.04); s.connect(f).connect(g).connect(out); s.start(t,Math.random()); s.stop(t+.06); }

function musicTick(){
  const a=AC; if(!a||!MUS.cur||muted||MUS.ext||a.state!=='running')return; const tr=TRACKS[MUS.cur]; if(!tr)return;
  const out=musicOut(), sd=60/tr.bpm/2;
  if(MUS.next<a.currentTime) MUS.next=a.currentTime+.06;
  while(MUS.next<a.currentTime+.2){
    const t=MUS.next, st=MUS.step;
    tr.v.forEach(v=>{ const e=v.ev[st%v.len]; if(e&&e.f) mnote(e.f,t,e.d*sd*.95,v.wave,v.vol,out); });
    if(tr.drums){ const c=tr.drums[st%tr.drums.length]; if(c!=='.')drum(c,t,out); }

function npcAt(x,y){ return S.map.npcs.find(n=>(!n.show||n.show())&&n.x===x&&n.y===y); }
function blocked(x,y){ const t=tileAt(S.map,x,y); if(t==='@'&&S.flags.gateOpen) return !!npcAt(x,y); return SOLID.has(t)||!!npcAt(x,y); }
function tryMove(dir){
  if(tileAt(S.map,P.x,P.y)==='i'){ dir=OPP[dir]; if(!S.flags.mirrorTold){ S.flags.mirrorTold=true; toast('镜子地板：方向颠倒了！',1500,'#9ff5ea'); } }
  if(S.map.moveHook){ const r=S.map.moveHook(dir); if(r===null) return; if(r) dir=r; }
  const [dx,dy]=DIRV[dir]; P.dir=dir; const nx=P.x+dx, ny=P.y+dy;
  if(nx<0||ny<0||nx>15||ny>11){
    const ee=S.map.edgeExit&&S.map.edgeExit[dir];
    if(ee){ const m=ee.gate&&ee.gate(); if(m){ run(()=>say('',m)); return; } run(()=>goMap(ee.to,ee.x==='same'?P.x:ee.x,ee.y==='same'?P.y:ee.y,ee.dir)); return; }
    const e=S.map.edges&&S.map.edges[dir]; if(e) run(()=>say('',e)); return;
  }
  const ex=S.map.exits[nx+','+ny];
  if(ex&&ex.gate){ const m=ex.gate(); if(m){ run(()=>say('',m)); return; } }
  if(blocked(nx,ny)){ if(!tryMove._b||S.time-tryMove._b>.3){sfx.bump();tryMove._b=S.time;} return; }
  let px=P.x, py=P.y;
  P.fx=P.x;P.fy=P.y;P.tx=nx;P.ty=ny;P.t=0;P.moving=true;
  for(const f of PARTY){ f.fx=f.x; f.fy=f.y; f.tx=px; f.ty=py; f.moving=!(f.x===px&&f.y===py); if(f.moving){ const ddx=f.tx-f.x, ddy=f.ty-f.y; f.dir=ddx>0?'right':ddx<0?'left':ddy>0?'down':'up'; } px=f.fx; py=f.fy; }
  if(Math.random()<.5)sfx.step();
}
function onArrive(){
  const ex=S.map.exits[P.x+','+P.y];
  if(ex){ run(()=>goMap(ex.to,ex.x,ex.y,ex.dir)); return; }
  const fn=S.map.onStep&&S.map.onStep(P.x,P.y); if(fn) run(fn);
}
function interact(){
  const [dx,dy]=DIRV[P.dir], x=P.x+dx, y=P.y+dy;

  const a=S.map.acts[x+','+y]; if(a){ run(a); }
}
async function run(fn){ if(S.busy)return; S.busy=true; try{ await fn(); }catch(e){ console.error(e); } finally{ S.busy=false; } }
function setParty(list){ PARTY=list.map(spr=>({spr,x:P.x,y:P.y,fx:0,fy:0,tx:0,ty:0,dir:P.dir,moving:false})); placeParty(); }
function placeParty(){
  let ax=P.x, ay=P.y, adir=P.dir; const used=new Set([P.x+','+P.y]);
  for(const f of PARTY){
    const [dx,dy]=DIRV[adir]; let fx=ax-dx, fy=ay-dy;
    const ok=(x,y)=>x>=0&&y>=0&&x<16&&y<12&&!blocked(x,y)&&!S.map.exits[x+','+y]&&!used.has(x+','+y);
    if(!ok(fx,fy)){ fx=ax; fy=ay; for(const [bx,by] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(ok(ax+bx,ay+by)){fx=ax+bx;fy=ay+by;break;} } }
    f.x=fx; f.y=fy; f.moving=false; f.dir=P.dir; used.add(fx+','+fy); ax=fx; ay=fy;
  }
}

      {label:'顶嘴（看准时机）',fn:async()=>{ const d=await timing(); if(B.talkOnly&&d===0) await say('','灰咕噜轻轻一抬翅膀，刚才那一下就被倒带抹掉了。'); }},
      {label:'讲道理',fn:async()=>{ const list=B.talkOnly?cfg.rewind.talk:cfg.talk; const lines=list[Math.min(B.talkI,list.length-1)]; B.talkI++; await T(lines); hit(B.talkOnly?cfg.rewind.talkDmg:cfg.talkDmg,B.talkOnly?'心防松动':'动摇'); B.calm=true; await wait(400); }},

    }});

      await T(cfg.rewind.after); continue;

function updateBattle(dt){
  if(!B)return;
  B.flashE=Math.max(0,B.flashE-dt);
  if(B.mode==='timing'&&!B.tm.done){ const tm=B.tm; tm.x+=tm.dir*tm.speed*dt; if(tm.x>160){tm.x=160;tm.dir=-1;tm.passes++;} if(tm.x<0){tm.x=0;tm.dir=1;tm.passes++;} if(tm.passes>=4){ tm.x=0; timingPress(); } }
  if(B.mode==='dodge'){
    B.dt+=dt; B.inv=Math.max(0,B.inv-dt);
    const sp=78; const mx=(held.right?1:0)-(held.left?1:0), my=(held.down?1:0)-(held.up?1:0);
    B.soul.x=Math.max(BOX.x+1,Math.min(BOX.x+BOX.w-8,B.soul.x+mx*sp*dt)); B.soul.y=Math.max(BOX.y+1,Math.min(BOX.y+BOX.h-7,B.soul.y+my*sp*dt));
    if(B.dt<B.dur-.6) B.spawn(B);
    for(const p of B.proj){
      if(p.hold>0){p.hold-=dt;continue;}
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.bounce){ if(p.x<BOX.x){p.x=BOX.x;p.vx*=-1;} if(p.x>BOX.x+BOX.w-p.w){p.x=BOX.x+BOX.w-p.w;p.vx*=-1;} if(p.y>BOX.y+BOX.h-p.h){p.y=BOX.y+BOX.h-p.h;p.vy*=-1;} if(p.y<BOX.y&&p.vy<0){p.y=BOX.y;p.vy*=-1;} }
      const s=B.soul;
      if(B.inv<=0&&p.x<s.x+6&&p.x+p.w>s.x+1&&p.y<s.y+5&&p.y+p.h>s.y+1){ B.php-=B.dmg; B.inv=.9; sfx.hurt(); shake(.2); hudUpdate(); }
    }
    B.proj=B.proj.filter(p=>p.x>BOX.x-50&&p.x<BOX.x+BOX.w+50&&p.y>BOX.y-50&&p.y<BOX.y+BOX.h+50);
    if(B.dt>=B.dur||B.php<=0){ B.mode='idle'; B.proj=[]; const r=B.res; B.res=null; r&&r(); }
  }
}

  for(let i=TW.length-1;i>=0;i--){ const t=TW[i]; t.t+=dt; const k=Math.min(1,t.t/t.dur); t.fn(k); if(k>=1){ TW.splice(i,1); t.res(); } }

  if(B){ updateBattle(dt); return; }
  if(S.mode!=='play'||!S.map)return;
  if(S.map.onTick&&!S.busy&&!DS&&!CS&&!CardS&&!boardOpen) S.map.onTick(dt);
  if(P.moving){ P.t+=dt/.17; P.anim+=dt; if(P.t>=1){ P.moving=false; P.x=P.tx; P.y=P.ty; PARTY.forEach(f=>{ if(f.moving){f.x=f.tx;f.y=f.ty;f.moving=false;} }); onArrive(); } }
  if(!P.moving&&!S.busy&&!DS&&!CS&&!CardS&&!boardOpen){ for(const d of ['up','down','left','right']) if(held[d]){ tryMove(d); break; } }
}

  await wait(300); S.glint=1.6; sfx.glitch(); await wait(1300);
  await T([['小树','……！'],['','角落的箱子旁边，好像有两点紫光，一闪就不见了。'],['小树','是……是老鼠吧？一定是老鼠。']]);
  setGoal('检查那座老座钟');
}});
{
  const m=MAPS.attic;
  m.acts['4,5']=async()=>T([['','箱子上有几道奇怪的划痕，边缘泛着淡淡的紫光。'],['','像是……被什么东西啃过。']]);
  m.acts['11,5']=async()=>say('','小时候的玩具箱。发条青蛙还在，发条却不见了。');
  ['1,2','2,2','13,2','14,2','1,3','14,3','1,7','14,7','1,8','2,8','14,8'].forEach(k=>m.acts[k]=async()=>say('','一箱旧报纸，最上面那张的日期被撕掉了。'));
  const clock=async()=>{
    if(S.flags.clockDone){ await say('','钟门开着，里面空空的，只剩一股焦糖味的机油香。'); return; }
    await T([['','爷爷留下的老座钟。指针停在十二点，钟摆一动不动。'],['','钟面下刻着一行小字：「拨回你来的时刻。」']]);
    if(!S.flags.clue1&&!S.flags.clue2) await say('小树','我来的时刻？……什么意思？');
    const c=await choose(['拨到 三点','拨到 六点','拨到 九点','拨到 十二点','先不动它'],'把时针拨到……');
    if(c===4)return;
    if(c!==2){ sfx.bump(); await say('','指针咔哒一声，又弹回了十二点。'); if(!(S.flags.clue1&&S.flags.clue2)) await say('小树','走廊里……好像有些关于我的东西。'); return; }
    S.flags.clockSet=true; renderMap(); sfx.ok();
    await say('','时针转到九点的一瞬间——');
    thunder(); shake(.5);
    for(let i=0;i<13;i++){ bell(i===12?147:196,i*.32,i===12?1.4:.8); }
    await wait(1200);
    await say('','当——当——当——……老钟一连敲了十三下。');
    S.flash=1.2; S.flashCol='#fff4c0'; sfx.magic(); S.flags.clockDone=true; renderMap();
    const spots=[[P.x+1,P.y],[P.x-1,P.y],[P.x,P.y+1]]; const sp=spots.find(([x,y])=>!blocked(x,y))||spots[0];
    const g={id:'gulu',spr:'gulu',x:7,y:4,dir:'down',talk:async()=>say('咕噜','咕噜咕噜。我的能量还在充。')};
    if(P.x===7&&P.y===4){ g.x=sp[0]; g.y=sp[1]; }
    m.npcs.push(g); shake(.3);
    await wait(700); facePlayer(g);
    await T([
      ['咕噜','咕——噜！着陆成功……咦？坐标不对。这里不是 2126 年？'],
      ['小树','你、你是什么东西？猫头鹰？铁皮玩具？'],
      ['咕噜','失礼！我是时修局 T-7 型时间维修机器人。你可以叫我咕噜。'],
      ['咕噜','我在追一只「蚀时虫」。它专门啃食时间里的"瞬间"。'],
      ['咕噜','被它啃过的东西，会一点一点从世界上消失，连大家对它的记忆也会变淡。'],
      ['小树','所以……钟才会敲十三下？'],
      ['咕噜','多出来的那一声，是被啃坏的时间在打嗝。它顺着这座钟，溜进了你的世界。'],
      ['咕噜','我的能量只剩百分之七，飞都飞不高。小子，你得帮我。'],
      ['小树','可我明天还要考试……'],
      ['咕噜','那就更得抓紧了。谁知道它下一口，会不会啃掉你的作业本。'],
      ['咕噜','作为报酬——翅膀舱，开！'],
    ]);
    sfx.magic(); S.flash=.6; S.flashCol='#9ff5ea';
    take('手电筒（有电）'); give('回声手电');
    await T([['咕噜','「回声手电」。照一照，就能看见"过去"留下的脚印。'],['咕噜','你的旧手电我顺手升级了，不用谢。'],['小树','……我好像没说谢谢。'],['','窗外的雷声渐渐远了。那只紫色的东西，却不知道躲到了哪里。']]);
    await levelClear(1);
  };
  m.acts['7,2']=m.acts['7,3']=clock;
}

async function duel(){
  S.flags.duel=true;
  await T([
    ['大壮','哟，这不是考 32 分的小树吗？'],
    ['小树','那……那是我的作业本！'],
    ['大壮','你的？我在地上捡的。上面的名字都快看不清了——那就是我的！'],
    ['','作业本的封皮上，有一团紫光在慢慢蠕动。'],
    ['咕噜','小树，蚀时虫就藏在本子里！它在放大他的坏心眼。'],
    ['咕噜','先让他冷静下来——打起精神，跟他过两招！'],
    ['大壮','哈？一只铁皮鸟也想管闲事？来啊！'],
  ]);
  await tween(.25,t=>S.fade=t);
  await battle({
    name:'大壮',spr:'dazhuang',hpLabel:'气势',hp:36,php:20,bg:'alley',bgm:'battle',scale:4,ey:16,talkDmg:5,
    intro:[['','大壮把袖子一撸，从兜里掏出一把沙包。'],['咕噜','他出招的时候，用方向键控制红心躲开！']],
    talk:[

      [['小树','你平时再凶，也没抢过别人的作业啊。你今天不对劲！'],['大壮','……我、我也觉得头有点晕……']],
      [['咕噜','那团紫光在控制你！把本子放下！'],['大壮','少啰嗦，铁皮鸟！']],
    ],
    items:[{name:'咕噜道具：弹弹泡泡',n:1,use:async()=>{ await say('咕噜','翅膀舱，开！——弹弹泡泡！'); sfx.magic(); S.flash=.5; S.flashCol='#bfefff'; await wait(300); hit(12,'泡泡'); B.skip=true; await say('','一串彩色泡泡把大壮裹了起来，他在泡泡里弹来弹去，晕头转向。'); }}],
    stunLine:'呜哇……头好晕……让我缓缓……',
    patterns:[
      {line:'吃我一记沙包雨！',make:MK.rain(.32,72),dur:4.2,dmg:3},
      {line:'左右开弓！',make:MK.side(.38,88),dur:4.2,dmg:3},
      {line:'看我的连环沙包！',make:MK.combo(MK.rain(.55,70),MK.side(.7,80)),dur:4.8,dmg:3},
    ],
    loseText:'小树被砸得眼冒金星……咬咬牙，再来一次！',
    winLines:[['大壮','……不打了，不打了。'],['','大壮一屁股坐在地上，作业本从他怀里滑了出来。']],
  });
  S.flags.duelDone=true;
  await say('','作业本的封皮上，一团紫色的东西"噗"地弹了起来——');
  S.flags.bugOut=true; bugNpc.x=dz.x+1; bugNpc.y=dz.y; sfx.glitch(); S.flash=.6; S.flashCol='#c77dff'; shake(.3);
  await wait(400);
  await say('蚀时虫','咔嚓……咔嚓……');
  const path=[]; let bx=bugNpc.x, by=bugNpc.y;
  while(bx!==14){ path.push([bx<14?1:-1,0]); bx+=bx<14?1:-1; }
  while(by>2){ path.push([0,-1]); by--; }
  await npcWalk(bugNpc,path,.06); S.flags.bugGone=true; sfx.glitch();
  await T([
    ['咕噜','是蚀时虫！它翻墙往北边跑了——那边是……'],['小树','学校！'],
    ['咕噜','学校里最大的"时间"，是那座钟楼。它要去啃钟楼！'],
    ['大壮','……我也不知道自己怎么了。'],
    ['大壮','捡到那个本子以后，就总觉得……抢别人的东西特别痛快。'],
    ['大壮','这个发卡，也是在地上捡的。你帮我还给小月吧。'],

  await say('大壮','还有这个。我爸是学校看门的，钟楼的钥匙在我这儿。');

  await T([['大壮','刚才……对不起啊。'],['小树','嗯。下回别拿沙包砸我脸就行。']]);
  await levelClear(2);
}

function drawThumb(cv,g){
  const c=cv.getContext('2d'); c.imageSmoothingEnabled=false;
  const saveF=S.flags, saveL=S.level; S.flags=Object.assign({},g.flags||{}); if(g.level)S.level=g.level;
  const m=MAPS[g.map]; if(m.prep)m.prep();
  renderMapTo(c,m);
  if(g.clock){ const cx=128,cy=92; for(let i=0;i<13;i++){ const a=i/13*Math.PI*2-Math.PI/2; c.fillStyle=i===12?'#ff8a9c':'#d9c9ff'; c.fillRect(cx+Math.cos(a)*78-1|0,cy+Math.sin(a)*62-1|0,3,3);} }
  g.chars.slice().sort((a,b)=>a[2]-b[2]).forEach(([spr,x,y,dir,zz])=>{ drawSpr(c,spr,dir,0,x*16,y*16-2); if(zz){ c.fillStyle='#e8e4ff'; c.fillRect(x*16+11,y*16-5,3,1); c.fillRect(x*16+12,y*16-4,1,1); c.fillRect(x*16+11,y*16-3,3,1);} });
  if(g.dark){ const gr=c.createRadialGradient(124,72,20,124,72,150); gr.addColorStop(0,'rgba(4,3,10,0)'); gr.addColorStop(1,'rgba(4,3,10,.85)'); c.fillStyle=gr; c.fillRect(0,0,W,H); }
  S.flags=saveF; S.level=saveL; if(m.prep)m.prep(); if(S.map===m) renderMap();
}
function buildBoard(){
  const body=$('#boardBody'); body.innerHTML='';
  for(let ch=1;ch<=9;ch++){
    if(!CH_INFO[ch]||!GUIDE.some(g=>Math.ceil(g.n/3)===ch))continue;
    const sec=document.createElement('section'); sec.className='chap';
    const [k,t,d]=CH_INFO[ch];
    sec.innerHTML=`<div class="chap-h"><span class="k">${k}</span><h3>第${CN(ch)}章 · ${t}</h3><span>${d}</span></div><div class="cards"></div>`;
    const grid=sec.querySelector('.cards');
    GUIDE.filter(g=>Math.ceil(g.n/3)===ch).forEach(g=>{
      const cur=S.mode!=='title'&&S.level===g.n;
      const el=document.createElement('article'); el.className='lcard'+(cur?' cur':''); el.id='lv'+g.n;
      el.innerHTML=`<div class="shot"><canvas width="256" height="192"></canvas><span class="no">LV.${g.n}</span>${cur?'<span class="curtag">你在这里</span>':''}</div>
        <div class="bd"><h4>第${g.n}关 · ${LV[g.n]}</h4><p class="plot">${g.plot}</p><div class="tags">${g.tags.map(t=>`<i>${t}</i>`).join('')}</div>
        <details${cur?' open':''}><summary>小提示</summary><div class="in">${g.hint}</div></details>
        <details class="spoil"><summary>完整攻略（剧透）</summary><div class="in"><ol>${g.walk.map(w=>`<li>${w}</li>`).join('')}</ol></div></details>
        <div class="go"><button type="button" data-lv="${g.n}">从这关开始 ▶</button></div></div>`;
      drawThumb(el.querySelector('canvas'),g);
      grid.appendChild(el);
    });
    body.appendChild(sec);
  }
  body.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>jumpTo(+b.dataset.lv)));
}
function openBoard(){
  for(const k in held)held[k]=false;
  buildBoard(); boardOpen=true; $('#board').hidden=false; document.body.style.overflow='hidden';
  const cur=S.mode!=='title'&&document.getElementById('lv'+S.level);
  requestAnimationFrame(()=>{ if(cur) cur.scrollIntoView({block:'center'}); else $('#board').scrollTop=0; $('#boardClose').focus({preventScroll:true}); });
}
function closeBoard(){ boardOpen=false; $('#board').hidden=true; document.body.style.overflow=''; }
function jumpTo(n){
  closeBoard();
  if(S.mode==='title'&&!S.busy){ $('#title').hidden=true; run(()=>startLevel(n)); return; }
  try{ localStorage.setItem('tc_jump',String(n)); location.reload(); }catch(e){ toast('请先回到标题画面再选关',1600); }
}
$('#guideBtn').addEventListener('click',e=>{ audio(); e.target.blur(); openBoard(); });
$('#hintBtn').addEventListener('click',e=>{ audio(); e.target.blur(); openBoard(); });
$('#boardClose').addEventListener('click',closeBoard);

const c5Dist=(m,sx,sy)=>{ const D=new Array(192).fill(1e9); const q=[[sx,sy]]; D[sy*16+sx]=0;
  while(q.length){ const [x,y]=q.shift(); for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){ const nx=x+dx, ny=y+dy; if(!c5Pass(m,nx,ny)||D[ny*16+nx]<1e9)continue; D[ny*16+nx]=D[y*16+x]+1; q.push([nx,ny]); } }
  return D; };

const c5GetPrim=async(col)=>{

  setGoal('给春联、冻柿子、邮筒涂回颜色（0/3）');
}

    ['小川','……！你们、你们身上怎么有颜色？！'],

    ['小川','外地人都有颜色？我叫小川。今天早上一睁眼，整条胡同就成了黑白电视。'],

const c5BugStep=async(poked)=>{
  const m=MAPS.c5_maze, b=c5bug;
  if(S.flags.c5_caught||S.map!==m)return;
  const D=c5Dist(m,P.x,P.y); const cur=D[b.y*16+b.x];
  if(cur>6&&!poked) return;
  /* 环路核心：反复剪掉只有一个出口的格子，剩下的就是"圈儿"。圈儿还在时，虫子只在圈上跑，不钻死胡同。 */
  const core=new Set(); for(let y=0;y<12;y++)for(let x=0;x<16;x++) if(c5Pass(m,x,y)) core.add(x+','+y);
  const deg=(x,y)=>[[0,-1],[0,1],[-1,0],[1,0]].filter(([dx,dy])=>core.has((x+dx)+','+(y+dy))).length;
  for(let changed=true;changed;){ changed=false; for(const k of [...core]){ const [x,y]=k.split(',').map(Number); if(deg(x,y)<=1){ core.delete(k); changed=true; } } }
  const onRing=core.has(b.x+','+b.y);
  let best=null, bd=cur;
  for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){ const nx=b.x+dx, ny=b.y+dy; if(!c5Pass(m,nx,ny)||(nx===P.x&&ny===P.y))continue; if(onRing&&!core.has(nx+','+ny))continue; const d=D[ny*16+nx]; if(d>bd){ bd=d; best=[dx,dy]; } }
  if(!best){ if(cur<=1){ await c5Catch(); } return; }
  if(Math.random()<.4) tone(900+Math.random()*300,.04,'square',.02);
  await npcWalk(b,[best],.07);
  if(!S.flags.c5_closed){ S.flags.c5_runs=(S.flags.c5_runs||0)+1;
    if(S.flags.c5_runs===26) await T([['大壮','呼……呼……它在绕圈！我们追一圈，它跑一圈！'],['咕噜','这片胡同是个环。得把环断开——糖葫芦大爷说过，南边有道穿堂门。']]); }
}

/* 把 ASCII 草图翻译成瓦片字符（只替换 legend 里列出的字符），并检查每行 16 格 */
const c8rows=(id,legend,rows)=>{ const out=rows.map(r=>[...r].map(ch=>legend[ch]||ch).join('')); out.forEach((r,i)=>{ if([...r].length!==16) console.error('c8 map '+id+' row '+i+' length '+[...r].length); }); if(out.length!==12) console.error('c8 map '+id+' rows '+out.length); return out; };

const c8free=(m,b,x,y)=>{
  if(x<0||y<0||x>15||y>11) return false; const t=m.grid[y][x];
  if(SOLID.has(t)||t==='H'||m.exits[x+','+y]) return false;
  if(m.npcs.some(n=>n!==b&&(!n.show||n.show())&&n.x===x&&n.y===y)) return false;
  if((x===P.x&&y===P.y)||(P.moving&&x===P.tx&&y===P.ty)) return false;
  return true;
};
const C8N=[[1,0],[-1,0],[0,1],[0,-1]];
const c8bubTick=(m,b,dt)=>{
  if((b.show&&!b.show())||b.walking) return;
  b.cd=(b.cd||0)-dt; if(b.cd>0) return;
  const px=P.moving?P.tx:P.x, py=P.moving?P.ty:P.y, dd=(x,y)=>Math.abs(x-px)+Math.abs(y-py), d0=dd(b.x,b.y);
  const opts=C8N.filter(([dx,dy])=>c8free(m,b,b.x+dx,b.y+dy));
  if(!opts.length){ b.cd=.2; return; }
  if(d0<=3){
    const nf=(x,y)=>C8N.filter(([dx,dy])=>c8free(m,b,x+dx,y+dy)).length;
    const sc=opts.map(([dx,dy])=>({dx,dy,d:dd(b.x+dx,b.y+dy),n:nf(b.x+dx,b.y+dy),r:Math.random()})).sort((a,c)=>c.d-a.d||a.n-c.n||a.r-c.r);
    const s=sc[0];
    if(s.d>d0||(s.d===d0&&d0<=2)){ npcWalk(b,[[s.dx,s.dy]],.15); b.cd=.2; return; }
    b.cd=.15; return;
  }
  if(Math.random()<.5){ const [dx,dy]=opts[Math.random()*opts.length|0]; npcWalk(b,[[dx,dy]],.3); }
  b.cd=1.1;
};

};
