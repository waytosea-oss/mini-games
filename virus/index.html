<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>健康小卫士·彩丸出击</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#071822;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#fff;touch-action:none}
#app{position:absolute;left:50%;top:0;height:100%;width:100%;max-width:520px;transform:translateX(-50%);overflow:hidden;background:#0b2a3a}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:10}
.scr.on{display:flex}
.dim{background:rgba(4,16,28,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);justify-content:center}
.btn{border:0;outline:0;font-family:inherit;font-weight:900;color:#fff;font-size:20px;padding:14px 30px;border-radius:18px;cursor:pointer;position:relative;letter-spacing:2px;
 background:linear-gradient(#5be38a,#1fae58);box-shadow:0 5px 0 #13753a,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #13753a,0 4px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.blue{background:linear-gradient(#5cc8ff,#2585e0);box-shadow:0 5px 0 #17589a,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.orange{background:linear-gradient(#ffcf4a,#ff8a1f);box-shadow:0 5px 0 #b65a0c,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.red{background:linear-gradient(#ff7a8a,#e8344e);box-shadow:0 5px 0 #9c1d31,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.gray{background:linear-gradient(#9aa9b8,#66778a);box-shadow:0 5px 0 #44515f,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.sm{font-size:16px;padding:10px 18px;border-radius:14px}
.ibtn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ibtn svg{width:26px;height:26px}
.ibtn.off{opacity:.45}
.ibtn.off::after{content:"";position:absolute;width:30px;height:3px;background:#ff5a6e;transform:rotate(-45deg);border-radius:2px}
#title{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + max(4vh,48px));background:radial-gradient(ellipse at 50% 35%,rgba(120,240,220,.18),rgba(0,0,0,0) 60%)}
.logo{position:relative;text-align:center;line-height:1;margin-top:6px}
.logo img{width:min(96vw,440px);display:block;margin:0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:logoIn .8s cubic-bezier(.3,1.5,.5,1) both,logoBob 3.4s ease-in-out .8s infinite;transform-origin:50% 60%}
@keyframes logoIn{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.logo .l1{font-size:64px;font-weight:900;letter-spacing:4px;background:linear-gradient(#fff 10%,#bff7ff 45%,#4fd2ff 55%,#2d8cf0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0d3d78) drop-shadow(0 0 2px #0d3d78) drop-shadow(0 8px 14px rgba(0,0,0,.4));transform:rotate(-4deg)}
.logo .l2{display:inline-block;margin-top:12px;font-size:28px;font-weight:900;letter-spacing:6px;padding:6px 18px 8px;border-radius:14px;background:linear-gradient(#ff6b81,#e2325a);box-shadow:0 4px 0 #8f1736,0 8px 16px rgba(0,0,0,.35);transform:rotate(-4deg);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero{position:relative;width:100%;flex:1;min-height:200px}
.hero img{position:absolute;pointer-events:none}
.hero .doc{left:0;width:100%;bottom:3%;height:min(94%,46vh,390px);object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.hero .doc.still{animation:bob2 2.4s ease-in-out infinite}
.hero .v{width:min(22vw,100px);animation:vwob 2.6s ease-in-out infinite;transform-origin:50% 70%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
@keyframes vwob{0%,100%{transform:translateY(0) rotate(-7deg) scale(1,1)}20%{transform:translateY(-6px) rotate(-2deg) scale(.93,1.08)}45%{transform:translateY(-16px) rotate(7deg) scale(1.04,.97)}65%{transform:translateY(-8px) rotate(3deg) scale(1.09,.92)}85%{transform:translateY(2px) rotate(-4deg) scale(.96,1.05)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 6vh)}
.tbtns .btn.big{font-size:26px;padding:16px 56px;border-radius:22px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.row{display:flex;gap:12px;align-items:center;justify-content:center}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;align-items:center;justify-content:space-between;z-index:5}
.coinbox{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:20px;padding:4px 12px 4px 4px;font-weight:900;font-size:18px;box-shadow:inset 0 0 0 2px rgba(255,215,90,.4);transition:transform .08s}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23a 35%,#f0a000 75%,#b86d00);box-shadow:inset 0 0 0 2px #c98200,0 2px 3px rgba(0,0,0,.3);display:inline-flex;align-items:center;justify-content:center;color:#a35a00;font-size:15px;font-weight:900}
#levels{background:linear-gradient(rgba(5,20,32,.55),rgba(5,20,32,.85));padding-top:calc(env(safe-area-inset-top) + 70px)}
.wtitle{font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,0,.4);margin:6px 0 2px}
.wsub{font-size:14px;opacity:.8;margin-bottom:12px}
.wnav{display:flex;align-items:center;gap:14px;width:100%;justify-content:center}
.arrow{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;font-weight:900;cursor:pointer;line-height:1}
.arrow:disabled{opacity:.25}
.wcard{width:min(84vw,380px);border-radius:24px;padding:18px 16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lv{aspect-ratio:1;border-radius:22px;border:0;font-family:inherit;font-weight:900;font-size:30px;color:#fff;cursor:pointer;position:relative;
 background:linear-gradient(#64d7ff,#2a8fe6);box-shadow:0 5px 0 #185da0,inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv.boss{background:linear-gradient(#c58bff,#7b3fe0);box-shadow:0 5px 0 #4a2190,inset 0 3px 0 rgba(255,255,255,.45)}
.lv.lock{background:linear-gradient(#5a6b7c,#3d4b59);box-shadow:0 5px 0 #26313b;color:rgba(255,255,255,.4)}
.lv .st{font-size:13px;letter-spacing:1px;margin-top:2px;color:#ffd84a;text-shadow:0 1px 0 #8a5a00}
.lv .st i{font-style:normal;color:rgba(255,255,255,.3);text-shadow:none}
.lv .bt{position:absolute;top:-8px;right:-6px;font-size:11px;background:#ff3d5e;border-radius:8px;padding:2px 6px;box-shadow:0 2px 0 #92112b;letter-spacing:0}
.lvdeco{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;pointer-events:none}
.lvdeco img{max-height:min(150px,100%);object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
#lvDoc{height:150px;animation:bob2 2.4s ease-in-out infinite}
.lvboss{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:900;opacity:.95}
.lvboss img{height:120px;animation:bob2 1.8s ease-in-out infinite reverse}
.lvboss span{background:rgba(255,61,94,.85);padding:2px 10px;border-radius:10px;margin-top:4px}
.vs{font-size:34px;font-weight:900;font-style:italic;color:#ffd84a;text-shadow:0 3px 0 #a35a00,0 0 18px rgba(255,200,60,.6)}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lbtns{margin-top:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;gap:14px}
.dots{display:flex;gap:8px;margin:16px 0 8px}
.dots b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots b.on{background:#fff;width:22px;border-radius:5px}
#shop{background:linear-gradient(#0e3550,#081d2c);padding-top:calc(env(safe-area-inset-top) + 64px);overflow-y:auto;touch-action:pan-y;justify-content:flex-start;-webkit-overflow-scrolling:touch}
.shoph{font-size:28px;font-weight:900;letter-spacing:4px;margin:4px 0 12px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.ups{width:min(92vw,420px);display:flex;flex-direction:column;gap:10px}
.up{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.up .ic{width:54px;height:54px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.up .ic svg{width:40px;height:40px}
.up .tx{flex:1;min-width:0}
.up .nm{font-size:18px;font-weight:900}
.up .nm small{font-size:12px;opacity:.75;margin-left:6px;font-weight:700}
.up .ds{font-size:12px;opacity:.8;margin-top:2px}
.up .bar{display:flex;gap:2px;margin-top:5px}
.up .bar i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.up .bar i.f{background:linear-gradient(#ffe36b,#ffae00)}
.up .buy{flex:none;min-width:84px;font-size:15px;padding:9px 10px;border-radius:14px;display:flex;align-items:center;gap:4px;justify-content:center;letter-spacing:0}
.up .buy .coin{width:18px;height:18px;font-size:11px}
.up .buy.no{filter:grayscale(.8) brightness(.8)}
.skins{width:min(92vw,420px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.skin{border-radius:18px;padding:8px 6px;text-align:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);cursor:pointer}
.skin.eq{box-shadow:inset 0 0 0 3px #5be38a,0 0 16px rgba(91,227,138,.4)}
.skin img{height:92px;display:block;margin:0 auto 4px}
.skin .sn{font-weight:900;font-size:14px}
.skin .sd{font-size:11px;opacity:.8;min-height:28px}
.skin .sb{margin-top:4px;font-size:13px;font-weight:900;padding:5px 0;border-radius:10px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:3px}
.skin .sb .coin{width:16px;height:16px;font-size:10px}
.sech{width:min(92vw,420px);font-weight:900;font-size:16px;opacity:.85;margin:16px 0 4px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
#hud .tp{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;align-items:center;gap:10px}
#hud .ibtn{pointer-events:auto;width:40px;height:40px}
#hud .mid{flex:1;display:flex;flex-direction:column;align-items:center}
#hud .lvl{font-weight:900;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.4);letter-spacing:1px}
#hud .prog{width:100%;max-width:220px;height:10px;border-radius:5px;background:rgba(0,0,0,.4);margin-top:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#hud .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5be38a,#c8ff5a);border-radius:5px;transition:width .2s}
#hud .hearts{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 56px);display:flex;gap:4px}
#hud .hearts svg{width:24px;height:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#hud .bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);width:62%;display:none;text-align:center}
#hud .bossbar b{font-size:13px;letter-spacing:2px;text-shadow:0 2px 0 #000}
#hud .bossbar div{height:12px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);margin-top:2px}
#hud .bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#c55bff);transition:width .15s}
#colors{position:absolute;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:min(2.6vw,14px);pointer-events:none}
.cb{pointer-events:auto;width:min(14.5vw,58px);height:min(14.5vw,58px);border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);transition:transform .12s}
.cb canvas{position:absolute;left:10%;top:10%;width:80%;height:80%}
.cb.on{transform:scale(1.14) translateY(-4px);box-shadow:inset 0 0 0 4px #fff,0 0 18px var(--g),0 0 4px var(--g)}
.cb .k{position:absolute;bottom:-2px;right:-2px;font-size:10px;font-weight:900;background:#000a;border-radius:6px;padding:0 4px;opacity:.6}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;opacity:0}
#banner .b1{font-size:46px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.4)}
#banner .b2{font-size:18px;font-weight:800;opacity:.9;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#banner.show{animation:ban 2.2s ease forwards}
#banner.boss .b1{color:#ff5470;animation:shake .15s linear infinite}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-30px)}}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.panel{width:min(86vw,360px);border-radius:28px;padding:26px 20px 22px;text-align:center;background:linear-gradient(#1b5a7e,#0f3550);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),0 20px 50px rgba(0,0,0,.5);position:relative}
.panel h2{margin:0 0 6px;font-size:34px;font-weight:900;letter-spacing:4px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.panel .sub{opacity:.85;font-size:15px;margin-bottom:14px;line-height:1.5}
.panel .col{display:flex;flex-direction:column;gap:14px;align-items:stretch;margin-top:10px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 10px;height:80px}
.stars svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3));transform:scale(0)}
.stars svg.mid{width:78px;height:78px;margin-bottom:10px}
.stars svg.pop{animation:starpop .45s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes starpop{to{transform:scale(1)}}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px;font-weight:900;margin:4px 0 6px}
.togs{display:flex;gap:14px;justify-content:center;margin-top:16px}
.ribbon{position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:8px 26px;border-radius:14px;font-weight:900;font-size:20px;letter-spacing:3px;white-space:nowrap;background:linear-gradient(#ffcf4a,#ff8a1f);box-shadow:0 4px 0 #b65a0c,0 8px 16px rgba(0,0,0,.3)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:10px 18px;border-radius:14px;font-weight:800;z-index:30;display:none;white-space:nowrap}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50;background:#0b2a3a;font-weight:900;font-size:18px;gap:14px}
#loading .lb{width:200px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#loading .lb i{display:block;height:100%;width:0;background:#5be38a;transition:width .2s}
.tip{font-size:13px;opacity:.8;margin-top:4px;padding:6px 14px;border-radius:12px;background:rgba(0,0,0,.25)}
.help{display:flex;gap:10px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.help span{font-size:12px;background:rgba(0,0,0,.3);border-radius:10px;padding:4px 9px;opacity:.9}
/* back to hub (Tilo 游戏屋) */
.hubPill{position:absolute;z-index:6;left:12px;top:calc(env(safe-area-inset-top) + 10px);height:32px;padding:0 14px 0 10px;border:0;border-radius:16px;display:flex;align-items:center;gap:3px;font-family:inherit;font-size:14px;font-weight:900;letter-spacing:1px;color:#fff;cursor:pointer;
 background:linear-gradient(rgba(255,255,255,.26),rgba(255,255,255,.12));box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.28);text-shadow:0 1px 0 rgba(0,0,0,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .08s}
.hubPill b{font-size:22px;line-height:1;margin-top:-3px}
.hubPill:active{transform:scale(.94)}
.btn.hub{background:linear-gradient(#4fd8cf,#1f9aa6);box-shadow:0 5px 0 #11646d,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.hub:active{box-shadow:0 2px 0 #11646d,0 4px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}

#tip .tipArt{width:min(76vw,300px);height:auto;display:block;margin:6px auto 0;overflow:visible}
#tip .tV{animation:tipV 1.6s ease-in-out infinite;transform-origin:205px 63px}
#tip .tB{animation:tipB 1.6s ease-in-out infinite}
#tip .tHit{animation:tipH 1.6s ease-in-out infinite;transform-origin:170px 72px}
#tip .tMinus{animation:tipM 1.6s ease-in-out infinite}
@keyframes tipV{0%,100%{transform:translate(18px,-6px)}45%,55%{transform:translate(-14px,10px)}}
@keyframes tipB{0%,40%,70%,100%{stroke:#dff}48%,58%{stroke:#ff4d6a}}
@keyframes tipH{0%,42%,70%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}}
@keyframes tipM{0%,45%{opacity:0;transform:translateY(8px)}55%{opacity:1;transform:translateY(0)}90%,100%{opacity:0;transform:translateY(-10px)}}
#tip .tipT{font-size:20px;font-weight:900;line-height:1.45;margin:6px 0 4px}
#tip .tipS{font-size:13px;opacity:.8;margin-bottom:10px}
.pcs{width:min(92vw,420px);display:flex;flex-direction:column;gap:10px;margin:8px 0 16px}
.pc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.pc.eq{box-shadow:inset 0 0 0 3px var(--c),0 0 14px var(--c)}
.pc canvas{position:static;width:64px;height:64px;flex:none;border-radius:14px;background:rgba(0,0,0,.35)}
.pc .tx{flex:1;min-width:0}.pc .nm{font-size:17px;font-weight:900}.pc .nm small{font-size:12px;opacity:.75;margin-left:6px;white-space:nowrap}
.pc .ds{font-size:12px;opacity:.85;margin-top:2px;line-height:1.35}
.pc .bt{display:flex;flex-direction:column;gap:6px;flex:none}
.pc .btn{font-size:14px;padding:7px 10px;min-width:84px}
.cb.lock{opacity:.45;filter:grayscale(1)}
.cb.lock::after{content:'🔒';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px}
@media (max-height:720px){.aiNote{position:absolute!important;top:calc(env(safe-area-inset-top,0px) + 16px)!important;bottom:auto!important;font-size:10px!important;margin:0!important}}

</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<script>
/* 封面主角「健康小卫士」：AI 生成序列帧（24fps · 96 帧无缝循环，透明底）；
   实时绘制：六边形防护罩泡泡（流光 + 呼吸）、药丸炮口光晕、推进器火花、消毒气泡与医疗十字星光粒子。 */
(function () {
  const M = {"fw": 243, "fh": 284, "cols": 6, "rows": 4, "n": 96, "fps": 24, "sheets": ["robot_0", "robot_1", "robot_2", "robot_3"], "body": [17, 5, 232, 263], "track": [62, 70, 62, 70, 62, 71, 62, 72, 62, 73, 61, 75, 61, 78, 60, 80, 60, 83, 59, 86, 58, 88, 58, 91, 57, 94, 57, 96, 56, 98, 56, 100, 55, 103, 55, 105, 53, 108, 53, 110, 52, 113, 51, 114, 51, 115, 51, 115, 50, 112, 50, 109, 50, 103, 50, 98, 52, 92, 53, 87, 57, 83, 61, 81, 68, 82, 78, 99, 90, 131, 93, 155, 95, 171, 91, 170, 78, 155, 71, 143, 65, 122, 64, 112, 59, 102, 58, 99, 56, 95, 55, 93, 56, 90, 56, 85, 63, 77, 68, 73, 76, 79, 84, 103, 88, 147, 93, 164, 81, 164, 73, 152, 62, 133, 61, 120, 58, 104, 58, 98, 58, 94, 58, 92, 61, 87, 63, 82, 67, 79, 69, 78, 73, 88, 78, 108, 88, 148, 94, 170, 94, 191, 93, 193, 90, 190, 86, 188, 82, 182, 78, 175, 72, 166, 69, 157, 65, 144, 61, 134, 60, 119, 60, 111, 60, 99, 60, 92, 60, 85, 61, 81, 61, 77, 62, 75, 62, 74, 61, 72, 62, 71, 62, 71, 62, 70, 62, 70, 62, 70, 62, 70]};
  const doc = document.getElementById('tDoc'), BUB = ['#7fe9ff', '#a8f3ff', '#5fd0ff'], CR = ['#3ddc97', '#7ff0c0', '#ffffff'], SPK = ['#bff7ff', '#ffffff', '#ff9aa4'];
  let cdB = 0, cdC = .5, cdS = .2, cdJ = 0;
  function hexBubble(c, cx, cy, r, t) {
    c.save();
    const g = c.createRadialGradient(cx - r * .25, cy - r * .3, r * .15, cx, cy, r);
    g.addColorStop(0, 'rgba(190,255,255,.04)'); g.addColorStop(.72, 'rgba(110,225,255,.10)'); g.addColorStop(1, 'rgba(170,250,255,.55)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.fill();
    c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.clip();
    const s = r * .2, sweep = ((t * .35) % 1.6 - .3) * r * 2.4 - r * 1.2;
    c.lineWidth = 1.4;
    for (let yy = -r; yy < r; yy += s * 1.5) for (let xx = -r - s; xx < r + s; xx += s * 1.732) {
      const ox = (Math.round((yy + r) / (s * 1.5)) % 2) ? s * .866 : 0, hx = cx + xx + ox, hy = cy + yy;
      const d = Math.abs((hx - cx) + (hy - cy) * .6 - sweep); const a = .07 + .35 * Math.max(0, 1 - d / (r * .35));
      c.strokeStyle = 'rgba(200,250,255,' + a.toFixed(3) + ')'; c.beginPath();
      for (let k = 0; k < 6; k++) { const an = k * 1.0472 + .5236; c.lineTo(hx + Math.cos(an) * s * .92, hy + Math.sin(an) * s * .92); } c.closePath(); c.stroke();
    }
    c.restore();
    c.strokeStyle = 'rgba(220,255,255,.9)'; c.lineWidth = Math.max(2, r * .03); c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.stroke();
    c.globalAlpha = .8; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(cx - r * .45, cy - r * .5, r * .2, r * .08, -.7, 0, 6.283); c.fill();
    c.globalAlpha = .5; c.beginPath(); c.arc(cx + r * .6, cy + r * .42, r * .045, 0, 6.283); c.fill(); c.globalAlpha = 1;
  }
  TitleMascot({ meta: M, base: 'assets/robot/', host: doc, screen: document.getElementById('title'),
    clipTop: () => document.querySelector('#title .logo'), clipBottom: () => document.querySelector('#title .tbtns'), maxParts: 70,
    onToggle: (on) => doc.classList.toggle('still', !on),
    back(A, S) {
      const c = A.c, [cx, cy] = S.map(M.fw / 2, M.fh * .5);
      c.globalCompositeOperation = 'lighter'; const p = .8 + .2 * Math.sin(S.t * 2.1);
      A.glow('#5fe8ff', cx, cy, S.dw * 1.25, S.dh * 1.05, .28 * p);
    },
    front(A, S) {
      const c = A.c, u = S.u, g = S.track(); if (!g) return;
      const [cx, cy] = S.map(M.fw / 2, M.fh * .5), r = Math.max(S.dw, S.dh) * .58 * (1 + .015 * Math.sin(S.t * 2.4));
      c.globalCompositeOperation = 'source-over'; hexBubble(c, cx, cy, r, S.t);
      c.globalCompositeOperation = 'lighter';
      A.glow('#ff6b7a', g[0], g[1], 70 * u, 70 * u, .45 + .2 * Math.sin(S.t * 4.2));
      // 推进器火花
      if (S.ok && (cdJ -= S.dt) <= 0) { cdJ = .05;
        for (const fx of [.38, .62]) { const [x, y] = S.map(M.fw * fx + (Math.random() - .5) * 8, M.fh * .97); A.add({ x, y, vx: (Math.random() - .5) * 14 * u, vy: (40 + Math.random() * 40) * u, s: (.12 + Math.random() * .1) * u * 1.6, k: 'dot', c: '#7fe9ff', max: .35 + Math.random() * .2, fout: .25 }); } }
      // 炮口星光
      if (S.ok && (cdS -= S.dt) <= 0) { cdS = .18 + Math.random() * .16; const a = Math.random() * 6.283, sp = (8 + Math.random() * 20) * u;
        A.add({ x: g[0] + (Math.random() - .5) * 16 * u, y: g[1] + (Math.random() - .5) * 16 * u, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 10 * u, drag: 1.5, s: (.2 + Math.random() * .22) * u * 1.6, k: 'spark', c: SPK[(Math.random() * SPK.length) | 0], max: .6 + Math.random() * .5, tw: .3, rot: Math.random() * 3, vr: (Math.random() - .5) * 3 }); }
      // 防护罩外缘冒出的消毒气泡
      if ((cdB -= S.dt) <= 0) { cdB = .25 + Math.random() * .22; const a = Math.random() * 6.283;
        A.add({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: Math.cos(a) * 8 * u, vy: -(16 + Math.random() * 16) * u, s: (.14 + Math.random() * .18) * u * 1.6, k: 'bubble', c: BUB[(Math.random() * BUB.length) | 0], add: false, a: .85, max: 1.3 + Math.random() * .8, fin: .2, fout: .4, wob: 10 * u }); }
      if ((cdC -= S.dt) <= 0) { cdC = .5 + Math.random() * .45; const a = Math.random() * 6.283;
        A.add({ x: cx + Math.cos(a) * r * 1.05, y: cy + Math.sin(a) * r * 1.05, vy: -12 * u, s: (.18 + Math.random() * .16) * u * 1.6, k: 'cross', c: CR[(Math.random() * CR.length) | 0], max: .9 + Math.random() * .5, fin: .25, fout: .4 }); }
    } });
})();
</script>
