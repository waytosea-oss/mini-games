<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="重力邮局：拨动重力，让易碎圆包裹自己滚进信箱。">
  <meta name="theme-color" content="#1A1228">
  <title>重力邮局</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5.2' fill='%23E8A88A'/%3E%3Ccircle cx='8' cy='3.2' r='1.3' fill='none' stroke='%23C5C8D0' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.toggle('land', innerWidth > innerHeight);</script>
</head>
<body>
  <section id="screen-cover" class="screen">
    <img id="cover-bg" class="cover-bg" alt="" src="assets/cover/b05-cover-3x4-bg.webp">
    <div class="topbar">
      <a class="text-link" href="../index.html">返回预览</a>
      <span class="grow"></span>
      <button type="button" class="icon-btn" data-music aria-pressed="true" aria-label="音乐">乐</button>
    </div>
    <div class="cover-copy">
      <p class="eyebrow">邮仓 · 易碎件</p>
      <h1>重力邮局</h1>
      <p class="sub">把重力轻轻转向，让圆包裹自己滚进信箱。</p>
    </div>
    <div id="cover-mascot" class="mascot" role="img" aria-label="搪瓷圆身随重力轻倾"></div>
    <div class="cover-actions">
      <button type="button" class="btn-gold" id="btn-start">开始运送</button>
      <button type="button" class="btn" id="btn-cover-levels">关卡</button>
    </div>
  </section>

  <section id="screen-levels" class="screen" hidden>
    <div class="page">
      <div class="topbar">
        <a class="text-link" href="../index.html">返回预览</a>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="btn-levels-cover" aria-label="回封面">封</button>
        <button type="button" class="icon-btn" data-music aria-pressed="true" aria-label="音乐">乐</button>
      </div>
      <div class="levels-head">
        <div>
          <p class="eyebrow">五条短迷宫</p>
          <h1>重力邮局</h1>
          <p class="sub">转盘定重力，按住刹车减速。包裹不能拖。</p>
        </div>
        <div id="levels-mascot" class="mascot small" role="img" aria-label="搪瓷圆身动画"></div>
      </div>
      <div class="sens" id="sens-levels" role="group" aria-label="转盘灵敏度">
        <span>灵敏度</span>
        <button type="button" data-sens="low">稳</button>
        <button type="button" data-sens="mid">适中</button>
        <button type="button" data-sens="high">灵</button>
      </div>
      <p class="hint">方向键也能转向，空格键是刹车。灵敏度只改变转盘跟随的快慢，刹车的减速保持不变。</p>
      <div id="level-list" class="level-list"></div>
    </div>
  </section>

  <section id="screen-play" class="screen" hidden>
    <img id="scene-bg" class="scene-bg" alt="">
    <div class="scene-dim"></div>
    <div class="zone zone-integrity">
      <div class="meter" id="meter-integrity" role="meter" aria-label="完好度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <img class="meter-track" alt="" src="assets/ui/b05-integrity-track.png">
        <div class="fillclip"><img class="meter-fill" alt="" src="assets/ui/b05-integrity-fill-full.png"></div>
        <img class="meter-frame" alt="" src="assets/ui/b05-integrity-frame.png">
      </div>
    </div>
    <div class="zone zone-power">
      <div class="meter" id="meter-power" role="meter" aria-label="动力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <img class="meter-track" alt="" src="assets/ui/b05-power-track.png">
        <div class="fillclip"><img class="meter-fill" alt="" src="assets/ui/b05-power-fill-full.png"></div>
        <img class="meter-frame" alt="" src="assets/ui/b05-power-frame.png">
      </div>
    </div>
    <p class="zone zone-order" id="order-label"></p>
    <div class="zone zone-maze" id="maze-zone">
      <canvas id="maze"></canvas>
      <div class="maze-tools">
        <a class="text-link" href="../index.html">返回</a>
        <button type="button" class="text-link" id="btn-list">关卡</button>
        <button type="button" class="text-link" id="btn-restart">重开</button>
        <button type="button" class="text-link" id="btn-sens" aria-label="灵敏度">适中</button>
        <span class="grow"></span>
        <button type="button" class="icon-btn" data-music aria-pressed="true" aria-label="音乐">乐</button>
      </div>
      <p id="coach" class="coach"></p>
    </div>
    <div class="zone zone-dial" id="dial">
      <img class="dial-plate" alt="" src="assets/ui/b05-ui-gravity-dial.png">
      <img id="dial-arrow" class="dial-arrow" alt="" src="assets/ui/b05-ui-gravity-arrow.png">
    </div>
    <button type="button" class="zone zone-brake" id="brake" aria-label="刹车" aria-pressed="false">
      <img id="brake-img" alt="" src="assets/ui/b05-ui-brake-idle.png">
    </button>
    <div id="toast" class="toast" hidden></div>
    <div id="win-panel" class="win-panel" hidden>
      <div class="win-card">
        <p class="eyebrow" id="win-kicker">送达</p>
        <h2 id="win-title"></h2>
        <div class="medal-row" id="win-medals"></div>
        <p id="win-stats"></p>
        <div class="cover-actions">
          <button type="button" class="btn-gold" id="btn-next">下一单</button>
          <button type="button" class="btn" id="btn-again">再送一次</button>
          <button type="button" class="btn" id="btn-win-list">关卡列表</button>
        </div>
      </div>
    </div>
  </section>

  <script src="sim.js"></script>
  <script src="levels.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
