<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="行囊远征：把装备与消耗品装进有限背包，靠邻接走过霜、泥和短缺。">
  <title>行囊远征</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 6.5h10v7H3z' fill='%23C4A06A'/%3E%3Cpath d='M5 6.5c0-2 1.2-3.5 3-3.5s3 1.5 3 3.5' fill='none' stroke='%235C4030' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.toggle('land', innerWidth > innerHeight);</script>
</head>
<body>
  <section id="screen-cover" class="screen">
    <div class="cover-stage" id="cover-stage">
      <img class="plate" id="cover-bg" alt="" src="assets/cover/b07-cover-bg-3x4.webp">
      <div id="cover-anchor" class="anchor"></div>
      <div class="topbar">
        <a class="text-link" href="../index.html">返回预览</a>
        <span class="grow"></span>
        <button type="button" class="icon-btn" data-music aria-label="音乐">乐</button>
      </div>
      <div class="cover-copy">
        <p class="eyebrow">背包 · 邻接</p>
        <h1>行囊远征</h1>
        <p class="sub">同一只背包，换个摆法，就能走出不同的路。</p>
        <div class="cover-actions" id="cover-actions"></div>
      </div>
    </div>
  </section>

  <section id="screen-play" class="screen" hidden>
    <div class="bg-layer">
      <img id="play-bg" alt="">
    </div>
    <div class="zone zone-hud">
      <a class="text-link" href="../index.html">返回</a>
      <span class="grow"></span>
      <button type="button" class="icon-btn" id="btn-help" aria-label="规则">规</button>
      <button type="button" class="icon-btn" data-music aria-label="音乐">乐</button>
    </div>
    <div class="zone zone-badges" id="badges"></div>
    <div class="zone zone-encounter">
      <div class="enc-frame">
        <img class="enc-art" id="enc-art" alt="">
        <img class="enc-border" data-src="assets/ui/b07-ui-enc-frame.png" alt="">
      </div>
      <p class="enc-caption" id="enc-caption"></p>
    </div>
    <div class="zone zone-supply">
      <div class="meter" id="supply-meter">
        <div class="meter-clip"><img class="fill" id="supply-fill" alt="" src="assets/ui/b07-ui-supply-fill.png"></div>
        <img class="frame" alt="" src="assets/ui/b07-ui-supply-frame.png">
        <span class="meter-label" id="supply-label">补给</span>
      </div>
    </div>
    <div class="zone zone-durability">
      <div class="meter" id="durability-meter">
        <div class="meter-clip"><img class="fill" id="durability-fill" alt="" src="assets/ui/b07-ui-durability-fill.png"></div>
        <img class="frame" alt="" src="assets/ui/b07-ui-durability-frame.png">
        <span class="meter-label" id="durability-label">耐久</span>
      </div>
    </div>
    <div class="zone zone-grid" id="zone-grid">
      <div id="board">
        <img class="board-art" id="board-art" alt="">
        <img class="ov" id="ov-frost" alt="" data-src="assets/overlays/b07-overlay-frost-5x6.png">
        <img class="ov" id="ov-mud" alt="" data-src="assets/overlays/b07-overlay-mud-5x6.png">
        <div id="cell-box">
          <div id="cells"></div>
          <div id="pieces"></div>
          <div id="arrows"></div>
        </div>
      </div>
    </div>
    <div class="zone zone-route">
      <p id="forecast">先选一条路。</p>
      <div id="nodes"></div>
    </div>
    <div class="zone zone-buttons">
      <div id="route-picks"></div>
      <div id="tool-row"></div>
    </div>
    <div id="live-anchor" class="anchor"></div>
    <div id="stash-tray" hidden></div>
    <div id="peek" hidden></div>
    <div id="toast" hidden></div>
    <div id="banner" hidden></div>
  </section>

  <div id="loot-layer" class="overlay" hidden>
    <div class="sheet loot-sheet">
      <div class="enc-frame loot-frame">
        <img class="enc-art" id="loot-art" alt="" data-src="assets/encounters/b07-enc-loot.webp">
        <img class="enc-border" data-src="assets/ui/b07-ui-enc-frame.png" alt="">
      </div>
      <h2 id="loot-title">战利品</h2>
      <p id="loot-copy"></p>
      <div class="loot-item" id="loot-item"></div>
      <div class="choice-actions">
        <button type="button" class="img-btn" id="btn-keep">
          <img data-src="assets/ui/b07-ui-loot-keep.png" alt="">
          <span>留下</span>
        </button>
        <button type="button" class="img-btn" id="btn-abandon">
          <img data-src="assets/ui/b07-ui-loot-abandon.png" alt="">
          <span>放弃</span>
        </button>
      </div>
    </div>
  </div>

  <div id="result-layer" class="overlay" hidden>
    <div class="sheet result-sheet">
      <div class="result-visual">
        <img id="fx-frame" alt="">
        <div id="result-anchor" class="anchor"></div>
      </div>
      <p class="eyebrow" id="result-kicker"></p>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <div class="cover-actions" id="result-actions"></div>
    </div>
  </div>

  <div id="help-layer" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>怎么走</h2>
        <button type="button" class="img-btn tiny" id="btn-help-close" aria-label="关闭">
          <img data-src="assets/ui/b07-ui-btn-close.png" alt="">
        </button>
      </div>
      <ul class="rules" id="help-rules"></ul>
    </div>
  </div>

  <div id="ask-layer" class="overlay" hidden>
    <div class="sheet">
      <h2 id="ask-title">重开一趟</h2>
      <p id="ask-copy">当前进度会换成新的一趟。</p>
      <div class="cover-actions">
        <button type="button" class="btn-gold" id="ask-yes">仍要重开</button>
        <button type="button" class="btn" id="ask-no">留下进度</button>
      </div>
    </div>
  </div>

  <pre id="check-out" hidden></pre>
  <script src="sim.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
